# Every push and pull request: format, lint, tests and a release build on Windows, macOS and Linux, each build started
# once to prove it runs; on Linux also the acks file in real Lua 5.1; on macOS also the app, universal (Apple Silicon
# and Intel), signed ad hoc, in a disk image that is opened and checked. Every push to main then publishes them as a
# GitHub release. The version is the commit's UTC time (year.month.day.hourminutesecond), so every job agrees on it,
# and it's built into the program. Actions are pinned to a full commit SHA, as the organisation requires; the comment
# names the release.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version
        shell: bash
        run: echo "LFGPLUS_HELPER_VERSION=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y.%m.%d.%H%M%S)" >> "$GITHUB_ENV"
      - name: Tray libraries and Lua 5.1 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev lua5.1
      - name: The acks file loads in Lua 5.1 (Linux)
        if: runner.os == 'Linux'
        run: lua5.1 tests/lua/check-acks.lua tests/vectors/Acks.lua
      - name: Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - name: The build starts
        shell: bash
        run: |
          exe=target/release/lfgplus-helper
          if [ "$RUNNER_OS" = Windows ]; then exe="$exe.exe"; fi
          test "$("$exe" --version | tr -d '\r')" = "$LFGPLUS_HELPER_VERSION"
          "$exe" --list --state "$RUNNER_TEMP/smoke/state.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lfgplus-helper-${{ runner.os }}
          path: |
            target/release/lfgplus-helper
            target/release/lfgplus-helper.exe
          if-no-files-found: error
      - name: The app (macOS)
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p target/universal
          lipo -create -output target/universal/lfgplus-helper             target/aarch64-apple-darwin/release/lfgplus-helper target/x86_64-apple-darwin/release/lfgplus-helper
          lipo -info target/universal/lfgplus-helper
          bash tools/package-macos.sh "$LFGPLUS_HELPER_VERSION" target/universal/lfgplus-helper
      - name: The disk image opens and the app starts (macOS)
        if: runner.os == 'macOS'
        run: |
          mount="$RUNNER_TEMP/dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" dist/lfgplus-helper-macos.dmg
          test -L "$mount/Applications"
          codesign --verify --deep --strict "$mount/LFG+ Helper.app"
          test "$("$mount/LFG+ Helper.app/Contents/MacOS/lfgplus-helper" --version)" = "$LFGPLUS_HELPER_VERSION"
          hdiutil detach "$mount"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'macOS'
        with:
          name: lfgplus-helper-macOS-app
          path: dist/lfgplus-helper-macos.dmg
          if-no-files-found: error

  release:
    name: Publish
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One release at a time, in the order the pushes came.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: built
      - name: Name the files
        run: |
          mkdir dist
          mv built/lfgplus-helper-Windows/lfgplus-helper.exe dist/lfgplus-helper-windows.exe
          mv built/lfgplus-helper-macOS-app/lfgplus-helper-macos.dmg dist/lfgplus-helper-macos.dmg
          mv built/lfgplus-helper-Linux/lfgplus-helper dist/lfgplus-helper-linux
          ls -l dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y.%m.%d.%H%M%S)"
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "LFG+ Helper $VERSION" \
            --generate-notes
